name: runtime-pack

# Builds the FULLY-BUNDLED runtime pack (ADR-004) and — on real arm64
# hardware — verifies the entire translated stack actually serves a real
# Bedrock server: proot -> ubuntu rootfs -> box64 -> bedrock_server,
# including a RakNet protocol round-trip and world persistence.
#
# Invoked by CI (workflow_call) so every APK embeds a verified pack, and
# manually (workflow_dispatch) for pack-only iteration.

on:
  workflow_dispatch:
  workflow_call:

env:
  BDS_VERSION: "1.26.52.3"
  BDS_SHA256: "f6348d84fa714d04ca194f207e89453ca6bba0a1359396475271a52a150471c6"
  BDS_ZIP_BYTES: "94927522"
  BDS_UA: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36"

jobs:
  build-and-verify:
    name: Pack · build + arm64 stack verification
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache official BDS zip
        uses: actions/cache@v4
        with:
          path: ~/bds/bedrock-server-1.26.52.3.zip
          key: bds-1.26.52.3-f6348d84

      - name: Build runtime pack
        run: bash tools/build_runtime_pack.sh build/runtime_pack

      - name: Verify full stack on real arm64 hardware
        run: bash tools/test_runtime_stack.sh build/runtime_pack

      - name: Report
        run: |
          ls -la build/runtime_pack/
          echo
          python3 -c "import json; print(json.dumps(json.load(open('build/runtime_pack/manifest.json')), indent=2))"

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-pack
          path: build/runtime_pack/
          retention-days: 30
          if-no-files-found: error
