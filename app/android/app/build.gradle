plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "0.1.0"

android {
    namespace = "com.lunarjjo.pondok"
    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId = "com.lunarjjo.pondok"
        // Android 7.0+ — batas bawah stack referensi (Termux/proot/Box64).
        minSdk = 24
        // targetSdk 28 DELIBERAT: aplikasi sideload yang harus mengeksekusi
        // binary unduhan (BDS, playit agent) dari penyimpanan app-private.
        // Domain SELinux legacy pada targetSdk<=28 mengizinkan exec di sana
        // (pola yang sama dengan Termux). Lihat docs/ARCHITECTURE.md §2 dan
        // docs/RISK_REGISTER.md R-01. Konsekuensi: peringatan "dibuat untuk
        // Android lama" saat instal & tidak dapat masuk Play Store — kedua
        // hal diterima secara eksplisit (distribusi via GitHub Releases).
        targetSdk = 28
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            // CI menandatangani APK; build lokal tanpa keystore memakai debug.
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}
