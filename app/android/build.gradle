allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Shim kompatibilitas plugin lawas yang membaca flutter.compileSdkVersion.
subprojects {
    if (name != "app") {
        ext.flutter = [
            compileSdkVersion: 34,
            minSdkVersion: 24,
            targetSdkVersion: 28,
        ]
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
